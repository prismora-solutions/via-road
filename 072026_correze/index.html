<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>ViaRoad — Corrèze</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Nunito:wght@400;600;700&family=Fraunces:ital,wght@0,500;0,600;1,500&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20260730b">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>

  <div class="statut-reseau" id="statut-reseau" style="display:none">
    <i data-lucide="wifi-off"></i> Hors-ligne — synchro au retour du réseau
  </div>

  <header class="header">
    <div class="header-top">
      <a class="logo" href="../"><i data-lucide="map"></i> ViaRoad</a>
      <button class="btn-info" onclick="ouvrirIntro()" title="À propos de ce séjour"><i data-lucide="info"></i></button>
    </div>
    <div class="sejour-hero">
      <h1 class="sejour-titre" id="sejour-titre"></h1>
      <p class="sejour-meta" id="sejour-meta"></p>
      <div class="sejour-badges" id="sejour-badges"></div>
    </div>
  </header>

  <div class="intro-overlay" id="intro-overlay" onclick="if(event.target===this) fermerIntro()">
    <div class="intro-carte">
      <span class="intro-tape"></span>
      <div class="intro-tampon"><i data-lucide="compass"></i></div>
      <div class="intro-titre" id="intro-titre"></div>
      <p class="intro-texte-popup" id="intro-texte"></p>
      <button class="btn-intro-fermer" onclick="fermerIntro()">C'est parti <i data-lucide="arrow-right"></i></button>
    </div>
  </div>

  <div class="zone-overlay" id="zone-overlay" onclick="if(event.target===this) fermerZone()">
    <div class="zone-carte">
      <div class="zone-header">
        <div class="zone-titre-ligne"><i data-lucide="map-pin"></i><span id="zone-titre"></span></div>
        <button class="btn-icone" onclick="fermerZone()"><i data-lucide="x"></i></button>
      </div>
      <div class="zone-liste" id="zone-liste"></div>
    </div>
  </div>

  <div class="lightbox-overlay" id="lightbox-overlay" onclick="fermerLightbox()">
    <button class="lightbox-fermer" onclick="fermerLightbox()"><i data-lucide="x"></i></button>
    <button class="lightbox-nav lightbox-prev" id="lightbox-prev" onclick="lightboxNav(-1, event)"><i data-lucide="chevron-left"></i></button>
    <img class="lightbox-img" id="lightbox-img" src="" onclick="event.stopPropagation()">
    <button class="lightbox-nav lightbox-next" id="lightbox-next" onclick="lightboxNav(1, event)"><i data-lucide="chevron-right"></i></button>
    <div class="lightbox-compteur" id="lightbox-compteur"></div>
  </div>

  <nav class="nav-jours" id="nav-jours"></nav>

  <main class="main" id="main-content"></main>

  <script src="sejour.js"></script>
  <script src="app.js?v=20260730b"></script>
</body>
</html>
