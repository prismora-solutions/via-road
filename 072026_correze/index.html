<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>ViaRoad — Corrèze</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>

  <div class="statut-reseau" id="statut-reseau" style="display:none">
    <i data-lucide="wifi-off"></i> Hors-ligne — synchro au retour du réseau
  </div>

  <header class="header">
    <div class="header-top">
      <a class="logo" href="../"><i data-lucide="map"></i> ViaRoad</a>
    </div>
    <div class="sejour-hero">
      <h1 class="sejour-titre" id="sejour-titre"></h1>
      <p class="sejour-meta" id="sejour-meta"></p>
      <div class="sejour-badges" id="sejour-badges"></div>
    </div>
  </header>

  <nav class="nav-jours" id="nav-jours"></nav>

  <main class="main" id="main-content"></main>

  <script src="sejour.js"></script>
  <script src="app.js"></script>
</body>
</html>
